      rel="stylesheet"
    />
    <script>
      // 主题与语言提前应用，避免首屏闪白 / 闪中文
      (function () {
        try {
          var t = localStorage.getItem('hq-theme');
          var dark = t === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

          var l = localStorage.getItem('hq-locale') === 'en' ? 'en' : 'zh';
          var html = document.documentElement;
          html.setAttribute('lang', l === 'en' ? 'en' : 'zh-CN');
          html.setAttribute('data-locale', l);
          if (l === 'en') {
            document.title = 'HabitatQuest · Teacher Console';
            var meta = document.querySelector('meta[name="description"]');
            if (meta) {
              meta.setAttribute(
                'content',
                'HabitatQuest · Teacher Dashboard Prototype · A game-based learning platform for exploring animal habitats',
              );
            }
          }
        } catch (e) {}
      })();
    </script>
